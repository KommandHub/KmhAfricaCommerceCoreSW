services:
  shopware:
    # Built from the local Dockerfile: the stock dockware image plus shopware-cli,
    # so the plugin can be validated from inside its own test environment.
    build:
      context: .
      dockerfile: Dockerfile
    image: 'kommandhub-africacommercecore-plugin:6.7.8.0'
    container_name: kommandhub-africacommercecore-plugin
    environment:
      - 'XDEBUG_ENABLED=0'
      - 'PHP_VERSION=8.3'
    volumes:
      # ----------------------------------------------------------------------------------------------------------------------------------
      # PLUGINS
      - "./:/var/www/html/custom/static-plugins/KmhAfricaCommerceCoreSW"
      - "database:/var/lib/mysql"
      - "./Makefile:/var/www/html/Makefile"
      # - ".env.test:/var/www/html/.env.test"
      # ----------------------------------------------------------------------------------------------------------------------------------
      # EXCLUDE
      - "/var/www/html/custom/static-plugins/KmhAfricaCommerceCoreSW/.git/"
      - "/var/www/html/custom/static-plugins/KmhAfricaCommerceCoreSW/node_modules/"
      - "/var/www/html/custom/static-plugins/KmhAfricaCommerceCoreSW/vendor/"
      # ----------------------------------------------------------------------------------------------------------------------------------

volumes:
  database:
    driver: local
